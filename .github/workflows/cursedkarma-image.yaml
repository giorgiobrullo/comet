name: Build cursedkarma image

# The fork's own image: upstream plus the live response deadline, for the
# cursedkarma server (amd64 only).
on:
  push:
    branches:
      - cursedkarma
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            COMET_BRANCH=${{ github.ref_name }}
            COMET_COMMIT_HASH=${{ github.sha }}
            COMET_BUILD_DATE=${{ steps.date.outputs.date }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/comet:cursedkarma
            ghcr.io/${{ github.repository_owner }}/comet:cursedkarma-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
